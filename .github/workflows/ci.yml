name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_SUPABASE_URL: https://thinkbee-test.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_browser_test_only
      NEXT_PUBLIC_AUTH_REQUIRE_EMAIL_CONFIRMATION: "false"
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Set up Python for the API contract
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Export API contract
        working-directory: api
        run: |
          pip install -c requirements.lock -e .
          python scripts/export_openapi.py --output openapi.json

      - name: Check API contract snapshot
        run: diff -u ../api/openapi.json lib/api/openapi.json

      - name: Generate API types and mocks
        run: |
          npm run generate:api
          npm run generate:mocks

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build for browser tests
        run: npm run build

      - name: Check Home JavaScript budget
        run: npm run check:bundle

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Upload browser screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shell-browser-results
          path: web/test-results/
          retention-days: 7

  api:
    name: api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: thinkbee_test
          POSTGRES_USER: thinkbee
          POSTGRES_PASSWORD: thinkbee
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U thinkbee -d thinkbee_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://thinkbee:thinkbee@localhost:5432/thinkbee_test
    defaults:
      run:
        working-directory: api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: api/requirements.lock

      - name: Install dependencies
        run: pip install -c requirements.lock -e '.[dev]'

      - name: Audit dependencies
        run: |
          pip install pip-audit==2.10.1
          pip-audit --disable-pip --no-deps -r requirements.lock

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy app tests

      - name: Test
        run: pytest

      - name: Check migration graph
        run: alembic heads

      - name: Validate local infrastructure
        working-directory: .
        run: docker compose config --quiet

  api-client:
    name: api client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: api/requirements.lock

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install API dependencies
        working-directory: api
        run: pip install -c requirements.lock -e .

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Export OpenAPI schema
        working-directory: api
        run: python scripts/export_openapi.py --output openapi.json

      - name: Check API contract snapshot
        working-directory: web
        run: diff -u ../api/openapi.json lib/api/openapi.json

      - name: Generate TypeScript API types
        working-directory: web
        run: npm run generate:api

      - name: Generate MSW mocks
        working-directory: web
        run: npm run generate:mocks

      - name: Create browser mock worker
        working-directory: web
        run: npx msw init public --save

      - name: Check generated output
        working-directory: web
        run: test -s lib/api/schema.d.ts

      - name: Check generated mocks
        working-directory: web
        run: test -s mocks/generated/server.mjs

      - name: Type check generated output
        working-directory: web
        run: npm run typecheck

      - name: Test generated mocks
        working-directory: web
        run: npm test
